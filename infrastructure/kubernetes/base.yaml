apiVersion: v1
kind: Namespace
metadata:
  name: asegyapay
  labels:
    name: asegyapay
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asegyapay-ingress
  namespace: asegyapay
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.asegyapay.com
        - merchant.asegyapay.com
        - admin.asegyapay.com
      secretName: asegyapay-tls
  rules:
    - host: api.asegyapay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    - host: merchant.asegyapay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: merchant-portal
                port:
                  number: 3000
    - host: admin.asegyapay.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-portal
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: asegyapay
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-traffic
  namespace: asegyapay
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: asegyapay
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: asegyapay
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
