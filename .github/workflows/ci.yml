name: CI — Build, Test & Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/asegyapay

jobs:
  # ── Backend: Build & Test ───────────────────────────────────────────────────
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore AsegyaPay.sln

      - name: Build
        run: dotnet build AsegyaPay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test AsegyaPay.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: src/backend/TestResults

  # ── Backend: Security Scan ──────────────────────────────────────────────────
  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: backend-build-test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Dependency vulnerability scan
        run: |
          cd src/backend
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "⚠️ Vulnerable packages found!"
            cat vuln-report.txt
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build for CodeQL
        run: |
          cd src/backend
          dotnet build AsegyaPay.sln --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ── Frontend: Build & Lint ─────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        portal: [merchant-portal, admin-portal]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/${{ matrix.portal }}/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend/${{ matrix.portal }}
        run: npm ci

      - name: Type check
        working-directory: src/frontend/${{ matrix.portal }}
        run: npm run type-check

      - name: Lint
        working-directory: src/frontend/${{ matrix.portal }}
        run: npm run lint

      - name: Build
        working-directory: src/frontend/${{ matrix.portal }}
        run: npm run build

  # ── Docker: Build Images ────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: api-gateway
            context: src/backend/ApiGateway/AsegyaPay.ApiGateway
          - name: payment-service
            context: src/backend/Services/PaymentService/AsegyaPay.PaymentService.API
          - name: auth-service
            context: src/backend/Services/AuthService/AsegyaPay.AuthService.API
          - name: merchant-service
            context: src/backend/Services/MerchantService/AsegyaPay.MerchantService.API

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Deploy to Staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
    environment:
      name: staging
      url: https://staging.asegyapay.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to K8s
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/payment-service \
            payment-service=${{ env.IMAGE_PREFIX }}/payment-service:sha-${{ github.sha }} \
            -n asegyapay
          kubectl rollout status deployment/payment-service -n asegyapay --timeout=5m

  # ── Deploy to Production ──────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment:
      name: production
      url: https://api.asegyapay.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to Production K8s
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl set image deployment/payment-service \
            payment-service=${{ env.IMAGE_PREFIX }}/payment-service:sha-${{ github.sha }} \
            -n asegyapay
          kubectl rollout status deployment/payment-service -n asegyapay --timeout=10m
