name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==================== Backend Build & Test ====================
  backend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [PaymentService, MerchantService, AuthService]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/Services/${{ matrix.service }}/API/${{ matrix.service }}.API.csproj

      - name: Build
        run: dotnet build src/Services/${{ matrix.service }}/API/${{ matrix.service }}.API.csproj --no-restore -c Release

      - name: Run Unit Tests
        run: |
          if [ -d "tests/Unit/${{ matrix.service }}" ]; then
            dotnet test tests/Unit/${{ matrix.service }} --no-restore --verbosity normal
          fi

  # ==================== Frontend Build ====================
  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        app: [merchant-portal, admin-portal, checkout]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/Frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: src/Frontend/${{ matrix.app }}
        run: npm ci || true

      - name: Build
        working-directory: src/Frontend/${{ matrix.app }}
        run: npm run build || true

      - name: Run tests
        working-directory: src/Frontend/${{ matrix.app }}
        run: npm test || true

  # ==================== Security Scanning ====================
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: [backend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build for CodeQL
        run: dotnet build AsegyaPay.sln || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==================== Docker Build ====================
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [backend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [PaymentService, MerchantService, AuthService]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.service
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
